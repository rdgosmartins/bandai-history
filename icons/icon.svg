<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>
  <circle cx="256" cy="220" r="130" fill="none" stroke="#048A81" stroke-width="7" opacity=".85"/>
  <!-- Cardinal tick marks -->
  <line x1="256" y1="100" x2="256" y2="118" stroke="#C9A84C" stroke-width="5"/>
  <line x1="256" y1="322" x2="256" y2="340" stroke="#C9A84C" stroke-width="5"/>
  <line x1="136" y1="220" x2="154" y2="220" stroke="#C9A84C" stroke-width="5"/>
  <line x1="358" y1="220" x2="376" y2="220" stroke="#C9A84C" stroke-width="5"/>
  <!-- North needle (teal) -->
  <polygon points="256,108 266,228 256,238 246,228" fill="#048A81"/>
  <!-- South needle (muted) -->
  <polygon points="256,332 246,222 256,212 266,222" fill="#2a3e52"/>
  <!-- East needle (gold, shorter) -->
  <polygon points="362,220 242,230 232,220 242,210" fill="#C9A84C" opacity=".55"/>
  <!-- Center jewel -->
  <circle cx="256" cy="220" r="14" fill="#C9A84C"/>
  <circle cx="256" cy="220" r="5" fill="#1a1a2e"/>
  <!-- YOKO label -->
  <text x="256" y="450" text-anchor="middle" fill="#C9A84C"
        font-size="68" font-weight="700" font-family="Georgia, 'Times New Roman', serif"
        letter-spacing="14">YOKO</text>
</svg>
