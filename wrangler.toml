name = "bandai-history"
main = "worker.js"
compatibility_date = "2024-09-25"

# Static Assets: todo o resto do repositório (analyzer.html, css/, js/, icons/, etc.)
# é servido automaticamente pelo binding ASSETS. O worker.js roda ANTES disso —
# se a rota bater em uma das APIs (auth, decks, torneios, matchmaker...), ele
# responde direto; senão, repassa pro binding de assets (ver env.ASSETS.fetch()
# no final do worker.js).
[assets]
directory = "."
binding = "ASSETS"

# Bindings existentes que você já tinha configurado no worker antigo
# (bandai-auth) precisam ser recriados AQUI, no projeto bandai-history,
# já que a partir de agora é ele quem roda esse código:
#   - KV Namespace: AUTH_KV
#   - Secrets: JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#              ANTHROPIC_API_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY_JWK,
#              MATCHMAKER_SECRET
#   - Var:     ALLOWED_ORIGIN (opcional)
# Configure via `wrangler kv namespace create` / `wrangler secret put`,
# ou direto pela aba Bindings do dashboard do bandai-history.
